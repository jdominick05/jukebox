#
# Tier 1 integration stack: one pinned Lavalink node and one local HTTP audio
# server.  The bot's Discord side is faked in-process; nothing here talks to
# Discord or any external media service.

services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.2.2
    environment:
      LAVALINK_SERVER_PASSWORD: test-password
    volumes:
      - ./application.test.yml:/opt/Lavalink/application.yml:ro
    ports:
      - "127.0.0.1:${TEST_LAVALINK_PORT:?set TEST_LAVALINK_PORT}:2333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/2333'"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  audio:
    image: busybox:1.37
    command: ["httpd", "-f", "-p", "8000", "-h", "/audio"]
    volumes:
      - "${TEST_AUDIO_DIR:?set TEST_AUDIO_DIR}:/audio:ro"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/tone-a.wav"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
