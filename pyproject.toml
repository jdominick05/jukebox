[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jukebox"
version = "1.0.0"
description = "A Lavalink-backed Discord music bot with per-guild queues and crash recovery"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "jukebox contributors" }]
dependencies = [
    "discord.py==2.7.1",
    "lavalink==5.11.1",
    "aiosqlite==0.22.1",
    "aiohttp==3.14.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.6",
]

[tool.setuptools.packages.find]
include = ["jukebox*"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["jukebox", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "ASYNC", "PT"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT018"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
